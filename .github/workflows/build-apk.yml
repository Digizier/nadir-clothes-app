name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Recreate Official Android Platform
        run: |
          # 1. Backup google-services.json
          cp android/app/google-services.json /tmp/google-services.json
          
          # 2. Remove incomplete android folder
          rm -rf android
          
          # 3. Generate pristine official Flutter Android wrapper with real GradleWrapper jar & mipmap icons
          flutter create . --org com.digizier --project-name nadir_clothes --platforms android
          
          # 4. Restore google-services.json
          cp /tmp/google-services.json android/app/google-services.json
          
          # 5. Add Google services plugin to android/app/build.gradle
          sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services"/' android/app/build.gradle
          sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release AAB (App Bundle)
        run: flutter build appbundle --release

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nadir-clothes-android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
