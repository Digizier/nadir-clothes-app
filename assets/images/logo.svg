<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Crest / Monogram Icon -->
  <g transform="translate(40, 30)">
    <!-- Outer Diamond Frame -->
    <path d="M70 10 L130 70 L70 130 L10 70 Z" 
          stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linejoin="round" />
    <path d="M70 20 L120 70 L70 120 L20 70 Z" 
          stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" fill="none" />
    
    <!-- Stylized Weave / Needle Thread Pattern -->
    <path d="M70 32 L70 108 M32 70 L108 70" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6"/>
    
    <!-- Monogram Letters N & C interlocking -->
    <text x="56" y="80" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">N</text>
    <text x="84" y="80" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">C</text>

    <!-- Small Golden Star at Top and Bottom -->
    <circle cx="70" cy="10" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="70" cy="130" r="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: NADIR CLOTHES -->
  <g transform="translate(200, 60)">
    <!-- Brand Title -->
    <text x="0" y="45" font-family="'Cinzel', 'Didot', 'Playfair Display', serif" font-size="46" font-weight="800" letter-spacing="6" fill="url(#goldGrad)">
      NADIR
    </text>
    <text x="185" y="45" font-family="'Cinzel', 'Didot', 'Playfair Display', serif" font-size="46" font-weight="300" letter-spacing="6" fill="#F8FAFC">
      CLOTHES
    </text>

    <!-- Separator Line with Diamond -->
    <path d="M0 65 L360 65" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
    <polygon points="180,62 183,65 180,68 177,65" fill="url(#goldGrad)"/>

    <!-- Subtitle / Tagline -->
    <text x="180" y="82" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" letter-spacing="7" fill="#94A3B8" text-anchor="middle">
      EST. 2026  •  PREMIUM APPAREL
    </text>
  </g>
</svg>
